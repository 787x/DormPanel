<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DormPanel Schedule Manager</title><link rel="stylesheet" href="/app/dormpanel-schedule-manager/style.css"></head>
<body><header><div><small>DORMPANEL / fnOS · 0.2.1</small><h1>课程表管理</h1></div><div><button id="refresh">检查并同步</button><button id="newCourse">新增课程</button><button id="newEvent">新增事件</button><button id="manage">管理</button></div></header>
<section id="status" role="status">正在读取本地状态…</section><nav><button id="prev">← 上周</button><button id="today">本周</button><button id="next">下周 →</button><input id="date" type="date" aria-label="选择日期"><select id="zone" aria-label="显示时区"><option>Asia/Shanghai</option><option>UTC</option><option>America/New_York</option></select><strong id="range"></strong></nav>
<nav><select id="term" aria-label="导航学期"></select><label>第 <input id="teachingWeek" type="number" min="1" max="1000" value="1" aria-label="教学周"> 周</label><button id="jump" disabled>前往教学周</button></nav>
<main><section id="week" aria-label="周课表"></section><aside><h2>数据与历史</h2><div id="details"></div><h2>学期配置</h2><div id="profiles"></div><h2>课程来源</h2><div id="sources"></div><h2>日历事件</h2><div id="events"></div></aside></main><section id="manager" hidden><h2>管理</h2><nav><button id="newProfile">新增学期</button><button id="adjustDate">停课 / 补课</button><button id="importFile">导入 ICS / 湖北大学 CSV</button><button id="config">WebDAV 配置</button><button id="conflicts">查看冲突</button><button id="bind">确认绑定已有数据集</button><button id="create">在空目录创建数据集</button></nav><div id="records"></div></section><dialog id="editor"><form id="editorForm"><h2 id="editorTitle"></h2><div id="fields"></div><p id="formError" role="alert"></p><nav><button type="submit">保存本地</button><button type="button" id="cancel">关闭</button></nav></form></dialog><footer>本地保存独立于网络 · 同步仅检查观察到的版本 · 其他设备接收情况未知 · 无后台轮询</footer><script type="module" src="/app/dormpanel-schedule-manager/app.js"></script></body></html>
